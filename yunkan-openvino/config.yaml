name: 云瞰 VMS (OpenVINO)
version: "0.9.46"
slug: yunkan-openvino
description: 自托管摄像头云录制 + AI 分析。OpenVINO 变体，支持 Intel iGPU (UHD 6xx+ / Iris Xe / Arc) 硬件加速，J4125 / N100 / N305 等机型推理吞吐 3-5x。
url: https://yun-kan.com
arch:
  - amd64
startup: services
boot: auto
init: false
host_network: true
hassio_api: false
homeassistant_api: false
host_dbus: false
host_pid: false
privileged: []
full_access: false
devices:
  - /dev/dri:/dev/dri:rwm
udev: true
map:
  - share:rw
  - backup:rw
ports:
  23406/tcp: 23406
  23880/tcp: 23880
  24214/tcp: 24214
  23515/udp: 23515
  23515/tcp: 23515
  23443/tcp: 23443
ports_description:
  23406/tcp: 网页控制台 + App 接口 + 直播（必须）
  23880/tcp: RTSP（外部播放器在局域网直连，可选）
  24214/tcp: 内部流媒体服务（本机使用，不必对外开放）
  23515/udp: 实时画面低延迟通道（UDP）
  23515/tcp: 实时画面低延迟通道（TCP 回退）
  23443/tcp: 公网直连（HTTPS，默认关闭；在网页里启用外网访问后才需要）
webui: "http://[HOST]:[PORT:23406]/"
panel_icon: mdi:cctv
panel_title: 云瞰 (OpenVINO)
panel_admin: true
options:
  timezone: Asia/Shanghai
schema:
  timezone: str
environment:
  TZ: "{{ options.timezone }}"
  SKYVIEW_SELF_CONTAINER_NAME: addon_local_yunkan-openvino
  # 同 yunkan 加载项：显式声明部署形态，「不能一键升级」时给 HA 自己的更新入口。
  SKYVIEW_DEPLOY_PLATFORM: ha_addon
